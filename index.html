<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break and Focus Timer</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            /* Standard-Theme jetzt: Deep Sea (Blau) */
            --focus-bg: #1e3a8a;
            --focus-text: #bfdbfe;
            --break-bg: #bfdbfe;
            --break-text: #1e3a8a;
            --accent: #10b981; /* emerald-500 */
        }

        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            background-color: #0c0a09;
        }

        .timer-digits {
            font-variant-numeric: tabular-nums;
        }

        .transition-dim {
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.6s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.8s ease;
        }

        /* Dynamische Panel-Farben */
        #panel-focus { background-color: var(--focus-bg); color: var(--focus-text); }
        #panel-break { background-color: var(--break-bg); color: var(--break-text); }

        /* Custom Scrollbar für Settings */
        .settings-scroll::-webkit-scrollbar { width: 4px; }
        .settings-scroll::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }

        #main-container { min-height: 0; overflow-y: auto; }
        section { min-height: 0; }

        @media (max-width: 640px) {
            .panel-circle { width: 5rem; height: 5rem; }
            .panel-icon { width: 2rem; height: 2rem; }
            .timer-display { font-size: 4.25rem; }
            .bounds-text { font-size: 0.75rem; }
            #bounds-focus,
            #bounds-break { display: none; }
        }

        @media (max-height: 700px) {
            .panel-circle { width: 8rem; height: 8rem; }
            .panel-icon { width: 2.5rem; height: 2.5rem; }
            .timer-display { font-size: 3.5rem; }
            .bounds-text { font-size: 0.7rem; }
            #bounds-focus { display: none; }
            .controls-wrapper { gap: 0.5rem; padding: 0.6rem 0.75rem; }
            .control-button { padding: 0.45rem; }
            .control-icon { width: 1.05rem; height: 1.05rem; }
        }

        /* Verhindert die unschönen Pfeiltasten in der Zahlen-Eingabe */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="text-stone-100 overflow-hidden h-screen w-screen flex flex-col justify-between">

    <main id="main-container" class="flex-1 flex flex-col md:flex-row h-full w-full relative min-h-0 overflow-y-auto">
        
        <!-- FOKUS-PANEL -->
        <section id="panel-focus" 
                 onclick="switchActiveMode('focus')"
                 class="flex-1 flex flex-col justify-center items-center p-6 transition-dim cursor-pointer min-h-0">
            
            <h2 class="text-2xl md:text-3xl font-light tracking-[0.25em] uppercase mb-6 md:mb-10 text-center">Fokus</h2>
            
            <div class="flex flex-row md:flex-col items-center justify-center gap-6 mb-6 md:mb-10 w-full max-w-xs">
                <div class="panel-circle relative w-16 h-24 sm:w-48 sm:h-48 md:w-64 md:h-64 flex items-center justify-center flex-shrink-0">
                    <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 100 100">
                        <!-- Hintergrund-Hilfskreis -->
                        <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="1" class="opacity-10" />
                        <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="1 3" class="opacity-30" />
                        <!-- Schrumpfender Fortschrittsbalken -->
                        <circle id="focus-circle" cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="276.46 276.46" stroke-dashoffset="0" stroke-linecap="round" class="transition-all duration-100 opacity-90" style="transform: scale(1, -1); transform-origin: 50px 50px;" />
                        <!-- Rotierender Zeiger -->
                        <circle id="focus-handle" cx="94" cy="50" r="2.5" fill="currentColor" class="transition-transform duration-100 origin-[50px_50px]" />
                    </svg>
                    
                    <!-- Lucide Icon: Brain/Focus -->
                    <i data-lucide="brain" class="panel-icon w-9 h-9 sm:w-16 sm:h-16 md:w-28 md:h-28 opacity-90"></i>
                </div>
                
                <!-- Doppelklick startet den optimierten Smart-Edit-Modus -->
                <div class="relative flex flex-col items-center md:items-center w-full px-4">
                    <div id="time-focus" 
                         ondblclick="startInlineEdit(event, 'focus')" 
                         class="timer-digits timer-display text-5xl sm:text-7xl md:text-9xl font-light tracking-normal cursor-text select-none hover:opacity-85 transition-all duration-200" 
                         title="Doppelklick zum schnellen Ändern (z.B. 1530 für 15:30)">25:00</div>
                    <!-- Start- und Endzeit-Anzeige -->
                    <div id="bounds-focus" class="mt-4 px-4 py-1.5 rounded-full text-[11px] 
                        sm:text-xs 
                        md:text-sm font-medium bg-black/10 backdrop-blur-sm tracking-wide opacity-80 uppercase transition-all duration-300 text-center bounds-text">
                    </div>
                </div>
            </div>
        </section>

        <!-- PAUSEN-PANEL -->
        <section id="panel-break" 
                 onclick="switchActiveMode('break')"
                 class="flex-1 flex flex-col justify-center items-center p-6 transition-dim cursor-pointer opacity-40 grayscale-[15%] min-h-0">
            
            <h2 class="text-2xl md:text-3xl font-light tracking-[0.25em] uppercase mb-6 md:mb-10 text-center">Pause</h2>
            
            <div class="flex flex-row md:flex-col items-center justify-center gap-6 mb-6 md:mb-10 w-full max-w-xs">
                <div class="panel-circle relative w-16 h-24 sm:w-40 sm:h-40 md:w-64 md:h-64 flex items-center justify-center flex-shrink-0">
                    <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 100 100">
                        <!-- Hintergrund-Hilfskreis -->
                        <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="1.5" class="opacity-10" />
                        <!-- Schrumpfender Fortschrittsbalken -->
                        <circle id="break-circle" cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="276.46 276.46" stroke-dashoffset="0" stroke-linecap="round" class="transition-all duration-100" style="transform: scale(1, -1); transform-origin: 50px 50px;" />
                    </svg>
                    
                    <!-- Lucide Icon: Coffee -->
                    <i data-lucide="coffee" class="panel-icon w-9 h-9 sm:w-16 sm:h-16 md:w-28 md:h-28 opacity-90"></i>
                </div>
                
                <!-- Doppelklick startet den optimierten Smart-Edit-Modus -->
                <div class="relative flex flex-col items-center md:items-center w-full px-4">
                    <div id="time-break" 
                         ondblclick="startInlineEdit(event, 'break')" 
                         class="timer-digits timer-display text-5xl sm:text-7xl md:text-9xl font-light tracking-normal cursor-text select-none hover:opacity-85 transition-all duration-200" 
                         title="Doppelklick zum schnellen Ändern (z.B. 0500 für 05:00)">05:00</div>
                    <!-- Start- und Endzeit-Anzeige -->
                    <div id="bounds-break" class="mt-4 px-4 py-1.5 rounded-full text-[11px]
                      sm:text-xs 
                      md:text-sm font-medium bg-black/10 backdrop-blur-sm tracking-wide opacity-80 uppercase transition-all duration-300 text-center bounds-text">Projektion: --:-- ➔ --:--
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- FLOATING BEDIENTASTEN (Dynamisch einklappend) -->
    <!-- Großer Hit-Bereich (pb-6 pt-12 px-12), damit das Menü leicht mit der Maus/Finger erwischt werden kann -->
    <div class="fixed bottom-0 left-1/2 -translate-x-1/2 z-20 pb-6 pt-12 px-12 group cursor-default">
        <!-- Das eigentliche Menü. Im Grundzustand skaliert auf 75% und halb transparent. -->
        <div class="controls-wrapper flex items-center justify-center gap-2 md:gap-3 bg-stone-900/90 backdrop-blur-md px-4 py-2 md:px-5 md:py-3 rounded-full border border-stone-800 shadow-2xl transition-all duration-300 ease-out transform scale-75 opacity-50 group-hover:scale-100 group-hover:opacity-100 focus-within:scale-100 focus-within:opacity-100">
            <button onclick="toggleSettingsModal(true)" class="control-button p-2 md:p-3 text-stone-400 hover:text-white transition-colors outline-none" title="Einstellungen">
                <i data-lucide="settings" class="control-icon w-5 h-5 md:w-6 md:h-6"></i>
            </button>

            <div class="h-5 md:h-6 w-[1px] bg-stone-800"></div>

            <button id="btn-play-pause" onclick="toggleTimer()" class="control-button p-3 md:p-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-full transition-all shadow-lg active:scale-95 outline-none">
                <i id="play-icon" data-lucide="play" class="control-icon w-5 h-5 md:w-6 md:h-6"></i>
                <i id="pause-icon" data-lucide="pause" class="control-icon w-5 h-5 md:w-6 md:h-6 hidden"></i>
            </button>

            <button onclick="skipOrReset()" class="control-button p-2 md:p-3 text-stone-400 hover:text-white transition-colors outline-none" title="Nächste Phase">
                <i data-lucide="skip-forward" class="control-icon w-5 h-5 md:w-6 md:h-6"></i>
            </button>

            <div class="h-5 md:h-6 w-[1px] bg-stone-800"></div>

            <button id="btn-sound-ambient" onclick="toggleAmbientSound()" class="control-button p-2 md:p-3 text-stone-400 hover:text-white transition-colors relative outline-none" title="Ambient Sound an/aus">
                <i id="sound-on-icon" data-lucide="volume-2" class="control-icon w-5 h-5 md:w-6 md:h-6 hidden"></i>
                <i id="sound-off-icon" data-lucide="volume-x" class="control-icon w-5 h-5 md:w-6 md:h-6 text-rose-500"></i>
            </button>
        </div>
    </div>

    <!-- EINSTELLUNGEN MODAL -->
    <div id="modal-settings" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-stone-900 border border-stone-800 rounded-3xl p-6 w-[95%] max-w-lg shadow-2xl transform scale-95 transition-transform duration-300 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-semibold">Konfiguration</h3>
                <button onclick="toggleSettingsModal(false)" class="text-stone-400 hover:text-white">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="settings-scroll overflow-y-auto pr-2 space-y-5 flex-1">
                <!-- Farb-Themes -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-stone-400 mb-2">Farb-Theme</label>
                    <div class="grid grid-cols-4 gap-3">
                        <button onclick="setTheme('classic')" class="h-10 rounded-lg border-2 border-stone-700 overflow-hidden flex" title="Classic">
                            <div class="w-1/2 h-full" style="background:#855E4D"></div><div class="w-1/2 h-full" style="background:#F5E2DA"></div>
                        </button>
                        <button onclick="setTheme('sea')" class="h-10 rounded-lg border-2 border-stone-700 overflow-hidden flex" title="Deep Sea">
                            <div class="w-1/2 h-full" style="background:#1e3a8a"></div><div class="w-1/2 h-full" style="background:#bfdbfe"></div>
                        </button>
                        <button onclick="setTheme('forest')" class="h-10 rounded-lg border-2 border-stone-700 overflow-hidden flex" title="Forest">
                            <div class="w-1/2 h-full" style="background:#064e3b"></div><div class="w-1/2 h-full" style="background:#d1fae5"></div>
                        </button>
                        <button onclick="setTheme('midnight')" class="h-10 rounded-lg border-2 border-stone-700 overflow-hidden flex" title="Midnight">
                            <div class="w-1/2 h-full" style="background:#171717"></div><div class="w-1/2 h-full" style="background:#404040"></div>
                        </button>
                    </div>
                </div>

                <!-- Zeiteinstellungen & Layout -->
                <div class="grid grid-cols-2 gap-4 pt-3 border-t border-stone-800">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-stone-400 mb-1.5">Fokus Dauer (Min)</label>
                        <input type="number" id="input-focus-time" min="1" class="w-full bg-stone-800 border border-stone-700 rounded-xl px-3 py-1.5 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-stone-400 mb-1.5">Pause Dauer (Min)</label>
                        <input type="number" id="input-break-time" min="1" class="w-full bg-stone-800 border border-stone-700 rounded-xl px-3 py-1.5 text-white">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-stone-400 mb-1.5">Panel Reihenfolge</label>
                        <select id="select-panel-order" class="w-full bg-stone-800 border border-stone-700 rounded-xl px-3 py-1.5 text-xs text-white">
                            <option value="focus-first">Fokus zuerst (Links / Oben)</option>
                            <option value="break-first">Pause zuerst (Links / Oben)</option>
                        </select>
                    </div>
                </div>

                <!-- FOKUS INTERVALL SOUNDS -->
                <div class="space-y-3 pt-3 border-t border-stone-800">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-emerald-400">Fokus-Phase</h4>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="block text-xs text-stone-400">Ambient-Typ</label>
                                <button id="btn-preview-ambient-focus" onclick="togglePreviewAmbient('focus')" class="text-[10px] text-emerald-400 hover:text-emerald-300 flex items-center gap-1 bg-emerald-500/10 px-1.5 py-0.5 rounded transition-all select-none">
                                    <svg class="w-2.5 h-2.5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>Testen</span>
                                </button>
                            </div>
                            <select id="select-focus-ambient-type" class="w-full bg-stone-800 border border-stone-700 rounded-xl px-3 py-1.5 text-xs text-white">
                                <option value="brown">Brown Noise (Tiefer Fokus)</option>
                                <option value="pink">Rosa Rauschen (Ausgewogen)</option>
                                <option value="white">Weißes Rauschen (Klassisch)</option>
                                <option value="rain">Sommerregen (Beruhigend)</option>
                                <option value="waves">Meeresrauschen (Wellen)</option>
                                <option value="fireplace">Kaminfeuer (Knistern)</option>
                                <option value="lofi">Lofi Chill Loop 🎵</option>
                                <option value="lofi_nostalgia">Lofi Nostalgia 🍂</option>
                                <option value="lofi_cozy">Cozy Café ☕</option>
                                <option value="lofi_sunset">Sunset Lounge 🌅</option>
                                <option value="space">Cosmic Drone 🌌</option>
                                <option value="birds">Waldesvögel 🌲</option>
                            </select>
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="block text-xs text-stone-400">Wechsel-Alarm</label>
                                <button onclick="triggerAlarmPreview('focus')" class="text-[10px] text-emerald-400 hover:text-emerald-300 flex items-center gap-1 bg-emerald-500/10 px-1.5 py-0.5 rounded transition-all select-none">
                                    <svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg><span>Hören</span>
                                </button>
                            </div>
                            <select id="select-focus-end-sound" class="w-full bg-stone-800 border border-stone-700 rounded-xl px-3 py-1.5 text-xs text-white">
                                <option value="bell">Klassische Glocke 🔔</option>
                                <option value="digital">Digitaler Wecker ⏰</option>
                                <option value="harp">Sanfte Harfe 🎵</option>
                                <option value="triumph">Triumph Arpeggio 🎉</option>
                                <option value="none">Stumm 🔇</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between text-[11px] mb-1">
                            <span class="text-stone-400 uppercase tracking-wider">Lautstärke Fokus Ambient</span>
                            <span id="label-focus-ambient-vol" class="text-white">30%</span>
                        </div>
                        <input type="range" id="range-focus-ambient-vol" min="0" max="100" class="w-full h-1 bg-stone-800 rounded-lg appearance-none accent-emerald-500">
                    </div>
                </div>

                <!-- PAUSEN INTERVALL SOUNDS -->
                <div class="space-y-3 pt-3 border-t border-stone-800">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-rose-400">Pausen-Phase</h4>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="block text-xs text-stone-400">Ambient-Typ</label>
                                <button id="btn-preview-ambient-break" onclick="togglePreviewAmbient('break')" class="text-[10px] text-rose-400 hover:text-rose-300 flex items-center gap-1 bg-rose-500/10 px-1.5 py-0.5 rounded transition-all select-none">
                                    <svg class="w-2.5 h-2.5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>Testen</span>
                                </button>
                            </div>
                            <select id="select-break-ambient-type" class="w-full bg-stone-800 border border-stone-700 rounded-xl px-3 py-1.5 text-xs text-white">
                                <option value="brown">Brown Noise (Tiefer Fokus)</option>
                                <option value="pink">Rosa Rauschen (Ausgewogen)</option>
                                <option value="white">Weißes Rauschen (Klassisch)</option>
                                <option value="rain">Sommerregen (Beruhigend)</option>
                                <option value="waves">Meeresrauschen (Wellen)</option>
                                <option value="fireplace">Kaminfeuer (Knistern)</option>
                                <option value="lofi">Lofi Chill Loop 🎵</option>
                                <option value="lofi_nostalgia">Lofi Nostalgia 🍂</option>
                                <option value="lofi_cozy">Cozy Café ☕</option>
                                <option value="lofi_sunset">Sunset Lounge 🌅</option>
                                <option value="space">Cosmic Drone 🌌</option>
                                <option value="birds">Waldesvögel 🌲</option>
                            </select>
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="block text-xs text-stone-400">Wechsel-Alarm</label>
                                <button onclick="triggerAlarmPreview('break')" class="text-[10px] text-rose-400 hover:text-rose-300 flex items-center gap-1 bg-rose-500/10 px-1.5 py-0.5 rounded transition-all select-none">
                                    <svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg><span>Hören</span>
                                </button>
                            </div>
                            <select id="select-break-end-sound" class="w-full bg-stone-800 border border-stone-700 rounded-xl px-3 py-1.5 text-xs text-white">
                                <option value="bell">Klassische Glocke 🔔</option>
                                <option value="digital">Digitaler Wecker ⏰</option>
                                <option value="harp">Sanfte Harfe 🎵</option>
                                <option value="triumph">Triumph Arpeggio 🎉</option>
                                <option value="none">Stumm 🔇</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between text-[11px] mb-1">
                            <span class="text-stone-400 uppercase tracking-wider">Lautstärke Pause Ambient</span>
                            <span id="label-break-ambient-vol" class="text-white">30%</span>
                        </div>
                        <input type="range" id="range-break-ambient-vol" min="0" max="100" class="w-full h-1 bg-stone-800 rounded-lg appearance-none accent-rose-500">
                    </div>
                </div>
            </div>

            <button onclick="saveSettings()" class="mt-4 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl transition-colors">
                Anwenden & Speichern
            </button>
        </div>
    </div>

    <script>
        // PWA Service Worker Registrierung (Deaktiviert für Vorschau)        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }

        // --- KONFIGURATION & THEMES ---
        const THEMES = {
            classic: { fBg: '#855E4D', fTxt: '#F5E2DA', bBg: '#F5E2DA', bTxt: '#855E4D' },
            sea: { fBg: '#1e3a8a', fTxt: '#bfdbfe', bBg: '#bfdbfe', bTxt: '#1e3a8a' },
            forest: { fBg: '#064e3b', fTxt: '#d1fae5', bBg: '#d1fae5', bTxt: '#064e3b' },
            midnight: { fBg: '#171717', fTxt: '#e5e5e5', bBg: '#404040', bTxt: '#f5f5f5' }
        };

        let state = {
            focusDuration: 25 * 60, // Standard 25m
            breakDuration: 5 * 60,  // Standard 5m
            focusRemaining: 25 * 60,
            breakRemaining: 5 * 60,
            currentMode: 'focus',
            isRunning: false,
            autoSwitch: true,
            bellVolume: 0.7,
            isAmbientPlaying: false,
            activeTheme: 'sea', 
            panelOrder: 'focus-first', // Standard-Reihenfolge
            
            // Getrennte Ambient-Konfiguration für Fokus und Pause
            focusAmbientType: 'brown',
            breakAmbientType: 'rain',
            focusAmbientVolume: 0.3,
            breakAmbientVolume: 0.3,
            
            // Getrennte Phasenende-Alarme
            focusEndSound: 'bell',
            breakEndSound: 'harp',
            
            // Intervall-Zeitstempel
            startTimestamp: null,
            endTimestamp: null
        };

        let timerInterval = null;
        let audioCtx = null;
        let ambientSource = null;
        let ambientGainNode = null;
        let isEditingInline = false; 

        // Modal Audio Preview Variablen
        let previewSource = null;
        let previewGainNode = null;
        let activePreviewPhase = null;

        // --- THEME & LAYOUT MANAGEMENT ---
        function setTheme(themeKey) {
            state.activeTheme = themeKey;
            const t = THEMES[themeKey];
            const root = document.documentElement;
            root.style.setProperty('--focus-bg', t.fBg);
            root.style.setProperty('--focus-text', t.fTxt);
            root.style.setProperty('--break-bg', t.bBg);
            root.style.setProperty('--break-text', t.bTxt);
        }

        function applyPanelOrder() {
            const focusPanel = document.getElementById('panel-focus');
            const breakPanel = document.getElementById('panel-break');
            if (state.panelOrder === 'break-first') {
                focusPanel.style.order = '2';
                breakPanel.style.order = '1';
            } else {
                focusPanel.style.order = '1';
                breakPanel.style.order = '2';
            }
        }

        // --- AUDIO ENGINE ---
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playAlarmSound(soundType) {
            if (soundType === 'none') return;
            initAudio();
            const now = audioCtx.currentTime;
            const mainGain = audioCtx.createGain();
            mainGain.gain.setValueAtTime(0, now);
            mainGain.gain.linearRampToValueAtTime(state.bellVolume, now + 0.01);
            mainGain.gain.exponentialRampToValueAtTime(0.0001, now + 4.0);
            mainGain.connect(audioCtx.destination);

            if (soundType === 'bell') {
                [220, 330, 440, 554, 880].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);
                    g.gain.setValueAtTime(0.5 / (i + 1), now);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + (4.0 / (i + 1)));
                    osc.connect(g); g.connect(mainGain);
                    osc.start(); osc.stop(now + 4.0);
                });
            } else if (soundType === 'digital') {
                const delays = [0, 0.25, 0.5];
                delays.forEach(delay => {
                    const osc = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(950, now + delay);
                    g.gain.setValueAtTime(0, now + delay);
                    g.gain.linearRampToValueAtTime(0.3, now + delay + 0.01);
                    g.gain.setValueAtTime(0.3, now + delay + 0.12);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + delay + 0.15);
                    osc.connect(g); g.connect(mainGain);
                    osc.start(now + delay); osc.stop(now + delay + 0.2);
                });
            } else if (soundType === 'harp') {
                const harpFreqs = [261.63, 329.63, 392.00, 523.25, 659.25];
                harpFreqs.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.15);
                    g.gain.setValueAtTime(0, now + idx * 0.15);
                    g.gain.linearRampToValueAtTime(0.25, now + idx * 0.15 + 0.03);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.15 + 1.6);
                    osc.connect(g); g.connect(mainGain);
                    osc.start(now + idx * 0.15); osc.stop(now + idx * 0.15 + 2.0);
                });
            } else if (soundType === 'triumph') {
                const notes = [196.00, 246.94, 293.66, 392.00, 493.88, 587.33];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    const filter = audioCtx.createBiquadFilter();
                    
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(1400, now);
                    
                    g.gain.setValueAtTime(0, now + idx * 0.08);
                    g.gain.linearRampToValueAtTime(0.15, now + idx * 0.08 + 0.03);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 1.4);
                    
                    osc.connect(filter); filter.connect(g); g.connect(mainGain);
                    osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 1.8);
                });
            }
        }

        function createNoiseBuffer(type) {
            const duration = 10;
            const sampleRate = audioCtx.sampleRate;
            const bufferSize = duration * sampleRate;
            const buffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
            const data = buffer.getChannelData(0);
            
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            let lastOut = 0.0; 

            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                const t = i / sampleRate;
                
                if (type === 'white') {
                    data[i] = white * 0.35;
                } 
                else if (type === 'pink') {
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    let pink = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                    b6 = white * 0.115926;
                    data[i] = pink * 0.06;
                } 
                else if (type === 'brown') {
                    data[i] = (lastOut + (0.02 * white)) / 1.02;
                    lastOut = data[i];
                    data[i] *= 1.3;
                } 
                else if (type === 'rain') {
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    let pink = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                    b6 = white * 0.115926;
                    
                    const droplet = Math.random() > 0.9985 ? (Math.random() * 0.35) : 0;
                    data[i] = (pink * 0.06) + droplet;
                } 
                else if (type === 'waves') {
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    let pink = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                    b6 = white * 0.115926;
                    
                    const lfo = 0.55 + 0.45 * Math.sin((2 * Math.PI * t) / duration - Math.PI / 2);
                    data[i] = pink * 0.07 * lfo;
                } 
                else if (type === 'fireplace') {
                    data[i] = (lastOut + (0.018 * white)) / 1.018;
                    lastOut = data[i];
                    data[i] *= 0.65;
                    if (Math.random() > 0.9995) {
                        data[i] += (Math.random() * 2 - 1) * 0.28;
                    }
                } 
                else if (type === 'lofi') {
                    const lofiChords = [
                        [164.81, 196.00, 246.94, 293.66], 
                        [220.00, 261.63, 329.63, 392.00], 
                        [146.83, 174.61, 220.00, 261.63], 
                        [196.00, 246.94, 293.66, 349.23]  
                    ];
                    let chordIdx = Math.floor(t / 2.5) % 4;
                    let chordTime = t % 2.5;
                    
                    let env = 1.0;
                    if (chordTime < 0.3) env = chordTime / 0.3;
                    else if (chordTime > 2.2) env = (2.5 - chordTime) / 0.3;

                    let waveSum = 0;
                    const freqs = lofiChords[chordIdx];
                    freqs.forEach(f => { waveSum += Math.sin(2 * Math.PI * f * t) * 0.22; });

                    let crackle = 0;
                    if (Math.random() > 0.9996) crackle = (Math.random() * 2 - 1) * 0.4;

                    data[i] = (waveSum * env * 0.15) + crackle * 0.03;
                } 
                else if (type === 'lofi_nostalgia') {
                    const chords = [
                        [87.31, 220.00, 261.63, 329.63],
                        [98.00, 246.94, 293.66, 329.63],
                        [82.41, 196.00, 246.94, 293.66],
                        [110.00, 261.63, 329.63, 392.00]
                    ];
                    let chordIdx = Math.floor(t / 2.5) % 4;
                    let chordTime = t % 2.5;
                    
                    let env = 1.0;
                    if (chordTime < 0.3) env = chordTime / 0.3;
                    else if (chordTime > 2.2) env = (2.5 - chordTime) / 0.3;

                    let wow = 0.00025 * Math.sin(2 * Math.PI * 3.2 * t);
                    let waveSum = 0;
                    const freqs = chords[chordIdx];
                    freqs.forEach(f => {
                        let p = 2 * Math.PI * f * (t + wow);
                        waveSum += Math.sin(p) * 0.18 + Math.sin(p * 2) * 0.05;
                    });

                    let crackle = 0;
                    if (Math.random() > 0.9997) crackle = (Math.random() * 2 - 1) * 0.35;

                    data[i] = (waveSum * env * 0.13) + crackle * 0.02;
                }
                else if (type === 'lofi_cozy') {
                    const chords = [
                        [110.00, 130.81, 196.00, 246.94],
                        [146.83, 185.00, 220.00, 329.63],
                        [98.00, 146.83, 185.00, 220.00], 
                        [130.81, 164.81, 196.00, 246.94] 
                    ];
                    let chordIdx = Math.floor(t / 2.5) % 4;
                    let chordTime = t % 2.5;
                    
                    let env = 1.0;
                    if (chordTime < 0.4) env = chordTime / 0.4;
                    else if (chordTime > 2.1) env = (2.5 - chordTime) / 0.4;

                    let waveSum = 0;
                    const freqs = chords[chordIdx];
                    freqs.forEach((f, idx) => {
                        let detune = 1.0008 * (idx - 1.5);
                        waveSum += Math.sin(2 * Math.PI * f * detune * t) * 0.2;
                    });

                    let chime = 0;
                    if (chordTime > 0.6 && chordTime < 1.1) {
                        let chimeT = chordTime - 0.6;
                        chime = Math.sin(2 * Math.PI * 880 * chimeT) * Math.exp(-12 * chimeT) * 0.06;
                    }

                    let crackle = 0;
                    if (Math.random() > 0.9995) crackle = (Math.random() * 2 - 1) * 0.3;

                    data[i] = (waveSum * env * 0.12) + chime + crackle * 0.02;
                }
                else if (type === 'lofi_sunset') {
                    const chords = [
                        [130.81, 164.81, 196.00, 246.94],
                        [87.31, 174.61, 220.00, 261.63], 
                        [146.83, 174.61, 220.00, 261.63],
                        [98.00, 146.83, 246.94, 293.66]  
                    ];
                    let chordIdx = Math.floor(t / 2.5) % 4;
                    let chordTime = t % 2.5;
                    
                    let env = 1.0;
                    if (chordTime < 0.3) env = chordTime / 0.3;
                    else if (chordTime > 2.2) env = (2.5 - chordTime) / 0.3;

                    let filterSweep = 0.5 + 0.5 * Math.sin(2 * Math.PI * 0.08 * t);
                    let waveSum = 0;
                    const freqs = chords[chordIdx];
                    freqs.forEach(f => {
                        let base = Math.sin(2 * Math.PI * f * t) * 0.18;
                        let harmonic = Math.sin(2 * Math.PI * f * 2 * t) * 0.05 * filterSweep;
                        waveSum += base + harmonic;
                    });

                    let crackle = 0;
                    if (Math.random() > 0.9997) crackle = (Math.random() * 2 - 1) * 0.25;

                    data[i] = (waveSum * env * 0.14) + crackle * 0.015;
                }
                else if (type === 'space') {
                    const f1 = 55.0; 
                    const f2 = 82.41; 
                    let spaceWave = Math.sin(2 * Math.PI * f1 * t) * 0.4 + Math.sin(2 * Math.PI * f2 * t) * 0.3;
                    
                    let starPing = 0;
                    if (t % 4.0 < 0.1) {
                        const pingTime = t % 4.0;
                        starPing = Math.sin(2 * Math.PI * 880 * pingTime) * Math.exp(-15 * pingTime) * 0.1;
                    }
                    data[i] = (spaceWave + starPing) * 0.12;
                } 
                else if (type === 'birds') {
                    let birdChirp = 0;
                    const cycle = t % 3.0;
                    if (cycle > 1.2 && cycle < 1.45) {
                        const chirpT = cycle - 1.2;
                        const freq = 2200 + 1200 * Math.sin(2 * Math.PI * 8 * chirpT) + 400 * chirpT;
                        birdChirp = Math.sin(2 * Math.PI * freq * chirpT) * Math.exp(-8 * chirpT) * 0.12;
                    }
                    data[i] = birdChirp;
                }
            }
            return buffer;
        }

        function startAmbientSound() {
            initAudio();
            stopAmbientSoundOnly();
            
            const activeType = state.currentMode === 'focus' ? state.focusAmbientType : state.breakAmbientType;
            const activeVolume = state.currentMode === 'focus' ? state.focusAmbientVolume : state.breakAmbientVolume;
            
            ambientSource = audioCtx.createBufferSource();
            ambientSource.buffer = createNoiseBuffer(activeType);
            ambientSource.loop = true;
            ambientGainNode = audioCtx.createGain();
            ambientGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            ambientGainNode.gain.linearRampToValueAtTime(activeVolume, audioCtx.currentTime + 1.5);
            
            ambientSource.connect(ambientGainNode);
            ambientGainNode.connect(audioCtx.destination);
            ambientSource.start();
            state.isAmbientPlaying = true;
            updateAmbientUI();
        }

        function stopAmbientSoundOnly() {
            if (ambientSource) {
                try {
                    ambientGainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
                    const s = ambientSource; setTimeout(() => s.stop(), 900);
                } catch(e) {}
                ambientSource = null;
            }
            state.isAmbientPlaying = false;
            updateAmbientUI();
        }

        function toggleAmbientSound() { state.isAmbientPlaying ? stopAmbientSoundOnly() : startAmbientSound(); }

        function updateAmbientUI() {
            document.getElementById('sound-on-icon').classList.toggle('hidden', !state.isAmbientPlaying);
            document.getElementById('sound-off-icon').classList.toggle('hidden', state.isAmbientPlaying);
            document.getElementById('btn-sound-ambient').classList.toggle('text-emerald-400', state.isAmbientPlaying);
        }

        // --- TIMER LOGIC ---
        function toggleTimer() { state.isRunning ? pauseTimer() : startTimer(); }

        function startTimer() {
            if (state.isRunning || isEditingInline) return;
            state.isRunning = true;
            
            const now = new Date();
            const remaining = state.currentMode === 'focus' ? state.focusRemaining : state.breakRemaining;
            state.startTimestamp = new Date(now);
            state.endTimestamp = new Date(now.getTime() + remaining * 1000);

            stopPreviewAmbient();

            if (!state.isAmbientPlaying) startAmbientSound();
            document.getElementById('play-icon').classList.add('hidden');
            document.getElementById('pause-icon').classList.remove('hidden');
            
            updateDisplay();

            timerInterval = setInterval(() => {
                const rem = state.currentMode === 'focus' ? 'focusRemaining' : 'breakRemaining';
                if (state[rem] > 0) { 
                    state[rem]--; 
                    updateDisplay(); 
                } else { 
                    handlePhaseEnd(); 
                }
            }, 1000);
        }

        function pauseTimer() {
            state.isRunning = false;
            clearInterval(timerInterval);
            document.getElementById('play-icon').classList.remove('hidden');
            document.getElementById('pause-icon').classList.add('hidden');
            stopAmbientSoundOnly();
            updateDisplay();
        }

        function handlePhaseEnd() {
            const finishedMode = state.currentMode;
            pauseTimer(); 
            
            const activeAlarm = finishedMode === 'focus' ? state.focusEndSound : state.breakEndSound;
            playAlarmSound(activeAlarm);

            // ZEIT ZURÜCKSETZEN FÜR ENDLOS-LOOP
            if (finishedMode === 'focus') {
                state.focusRemaining = state.focusDuration;
            } else {
                state.breakRemaining = state.breakDuration;
            }
            
            if (state.autoSwitch) {
                setTimeout(() => { 
                    switchActiveMode(finishedMode === 'focus' ? 'break' : 'focus'); 
                    startTimer(); 
                }, 1500);
            } else {
                updateDisplay();
            }
        }

        function updateActivePanelVisualState() {
            const focusPanel = document.getElementById('panel-focus');
            const breakPanel = document.getElementById('panel-break');
            focusPanel.classList.toggle('opacity-40', state.currentMode !== 'focus');
            focusPanel.classList.toggle('grayscale-[15%]', state.currentMode !== 'focus');
            breakPanel.classList.toggle('opacity-40', state.currentMode !== 'break');
            breakPanel.classList.toggle('grayscale-[15%]', state.currentMode !== 'break');
        }

        function switchActiveMode(mode) {
            if (isEditingInline) return;
            if (state.currentMode === mode) return;
            const wasRunning = state.isRunning;
            pauseTimer();
            state.currentMode = mode;
            updateActivePanelVisualState();
            
            state.startTimestamp = null;
            state.endTimestamp = null;

            updateDisplay();
            
            if (wasRunning) {
                startTimer();
            } else if (state.isAmbientPlaying) {
                startAmbientSound();
            }
        }

        function skipOrReset() {
            pauseTimer();
            state.focusRemaining = state.focusDuration;
            state.breakRemaining = state.breakDuration;
            state.startTimestamp = null;
            state.endTimestamp = null;
            switchActiveMode(state.currentMode === 'focus' ? 'break' : 'focus');
        }

        function formatTime(seconds) {
            return `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`;
        }

        function formatClock(date) {
            const h = date.getHours().toString().padStart(2, '0');
            const m = date.getMinutes().toString().padStart(2, '0');
            return `${h}:${m}`;
        }

        function updateDisplay() {
            document.getElementById('time-focus').innerText = formatTime(state.focusRemaining);
            document.getElementById('time-break').innerText = formatTime(state.breakRemaining);
            
            const circumference = 276.46;

            const focusRatio = state.focusRemaining / state.focusDuration;
            const focusFilledLength = focusRatio * circumference;
            const focusCircle = document.getElementById('focus-circle');
            focusCircle.setAttribute('stroke-dasharray', `${focusFilledLength} ${circumference}`);
            focusCircle.setAttribute('stroke-dashoffset', '0');
            const fRot = - (focusRatio * 360);
            document.getElementById('focus-handle').style.transform = `rotate(${fRot}deg)`;
            
            const breakRatio = state.breakRemaining / state.breakDuration;
            const breakFilledLength = breakRatio * circumference;
            const breakCircle = document.getElementById('break-circle');
            breakCircle.setAttribute('stroke-dasharray', `${breakFilledLength} ${circumference}`);
            breakCircle.setAttribute('stroke-dashoffset', '0');

            let displayStartStr = "";
            let displayEndStr = "";
            let prefix = "";

            if (state.isRunning && state.startTimestamp && state.endTimestamp) {
                displayStartStr = formatClock(state.startTimestamp);
                displayEndStr = formatClock(state.endTimestamp);
                prefix = "Intervall";
            } else {
                const now = new Date();
                const remainingSec = state.currentMode === 'focus' ? state.focusRemaining : state.breakRemaining;
                const endProj = new Date(now.getTime() + remainingSec * 1000);
                displayStartStr = `Jetzt (${formatClock(now)})`;
                displayEndStr = formatClock(endProj);
                prefix = "Projektion";
            }

            if (state.currentMode === 'focus') {
                document.getElementById('bounds-focus').innerText = `${prefix}: ${displayStartStr} ➔ ${displayEndStr}`;
                document.getElementById('bounds-focus').style.opacity = "1.0";
                document.getElementById('bounds-break').style.opacity = "0.4";
                document.getElementById('bounds-break').innerText = `Pause: ${Math.round(state.breakDuration / 60)} Min`;
            } else {
                document.getElementById('bounds-break').innerText = `${prefix}: ${displayStartStr} ➔ ${displayEndStr}`;
                document.getElementById('bounds-break').style.opacity = "1.0";
                document.getElementById('bounds-focus').style.opacity = "0.4";
                document.getElementById('bounds-focus').innerText = `Fokus: ${Math.round(state.focusDuration / 60)} Min`;
            }
        }

        // --- INLINE EDIT LOGIC (DOPPELKLICK) ---
        function startInlineEdit(event, mode) {
            event.stopPropagation();
            
            if (isEditingInline) return;
            isEditingInline = true;
            pauseTimer();

            state.startTimestamp = null;
            state.endTimestamp = null;

            const displayEl = document.getElementById(`time-${mode}`);
            const currentSeconds = mode === 'focus' ? state.focusDuration : state.breakDuration;
            const currentFormatted = formatTime(currentSeconds);

            const wrapper = document.createElement('div');
            wrapper.className = 'relative flex flex-col items-center justify-center';

            const input = document.createElement('input');
            input.type = 'text';
            input.value = currentFormatted;
            input.placeholder = "MM:SS oder MMSS";
            
            input.className = 'bg-transparent text-center focus:outline-none font-light border-b-2 border-dashed border-current w-[6ch] timer-digits transition-all duration-200';
            input.style.fontSize = 'inherit';
            input.style.fontFamily = 'inherit';
            input.style.color = 'inherit';

            const hint = document.createElement('div');
            hint.className = 'absolute -bottom-10 left-1/2 -translate-x-1/2 text-xs md:text-sm font-normal tracking-wide opacity-90 py-1.5 px-3.5 rounded bg-stone-950 text-stone-300 border border-stone-800 pointer-events-none whitespace-nowrap z-30 shadow-md';
            hint.innerText = "Enter zum Speichern (z.B. 1530 für 15:30, oder 25 für 25:00)";

            input.addEventListener('click', (e) => e.stopPropagation());
            input.addEventListener('dblclick', (e) => e.stopPropagation());

            const saveAndExit = () => {
                if (!isEditingInline) return;
                
                const rawVal = input.value.trim();
                let totalSeconds = currentSeconds;

                if (rawVal) {
                    if (rawVal.includes(':')) {
                        const parts = rawVal.split(':');
                        const m = parseInt(parts[0]) || 0;
                        const s = parseInt(parts[1]) || 0;
                        totalSeconds = m * 60 + s;
                    } else {
                        const cleanDigits = rawVal.replace(/\D/g, '');
                        if (cleanDigits.length > 0) {
                            if (cleanDigits.length <= 2) {
                                totalSeconds = parseInt(cleanDigits) * 60;
                            } else {
                                const s = parseInt(cleanDigits.slice(-2)) || 0;
                                const m = parseInt(cleanDigits.slice(0, -2)) || 0;
                                totalSeconds = m * 60 + s;
                            }
                        }
                    }
                }

                if (totalSeconds < 5) totalSeconds = 5;
                if (totalSeconds > 999 * 60) totalSeconds = 999 * 60;

                if (mode === 'focus') {
                    state.focusDuration = totalSeconds;
                    state.focusRemaining = totalSeconds;
                } else {
                    state.breakDuration = totalSeconds;
                    state.breakRemaining = totalSeconds;
                }

                saveLocalState();
                isEditingInline = false;
                updateDisplay();
            };

            const cancelEdit = () => {
                isEditingInline = false;
                updateDisplay();
            };

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') saveAndExit();
                else if (e.key === 'Escape') cancelEdit();
            });

            input.addEventListener('blur', () => saveAndExit());

            wrapper.appendChild(input);
            wrapper.appendChild(hint);
            displayEl.innerHTML = '';
            displayEl.appendChild(wrapper);
            
            input.focus();
            input.select();
        }

        // --- SETTINGS MODAL & STATE ---
        function saveLocalState() {
            localStorage.setItem('split_timer_v1_9', JSON.stringify({
                fD: state.focusDuration, bD: state.breakDuration,
                fAT: state.focusAmbientType, bAT: state.breakAmbientType,
                fAV: state.focusAmbientVolume, bAV: state.breakAmbientVolume,
                fES: state.focusEndSound, bES: state.breakEndSound,
                theme: state.activeTheme, pO: state.panelOrder
            }));
        }

        function toggleSettingsModal(s) {
            const m = document.getElementById('modal-settings');
            if (s) {
                document.getElementById('input-focus-time').value = state.focusDuration / 60;
                document.getElementById('input-break-time').value = state.breakDuration / 60;
                document.getElementById('select-focus-ambient-type').value = state.focusAmbientType;
                document.getElementById('select-break-ambient-type').value = state.breakAmbientType;
                document.getElementById('range-focus-ambient-vol').value = state.focusAmbientVolume * 100;
                document.getElementById('range-break-ambient-vol').value = state.breakAmbientVolume * 100;
                document.getElementById('label-focus-ambient-vol').innerText = `${Math.round(state.focusAmbientVolume * 100)}%`;
                document.getElementById('label-break-ambient-vol').innerText = `${Math.round(state.breakAmbientVolume * 100)}%`;
                document.getElementById('select-focus-end-sound').value = state.focusEndSound;
                document.getElementById('select-break-end-sound').value = state.breakEndSound;
                document.getElementById('select-panel-order').value = state.panelOrder;

                m.classList.remove('opacity-0', 'pointer-events-none');
                m.firstElementChild.classList.remove('scale-95');
            } else {
                stopPreviewAmbient();
                m.classList.add('opacity-0', 'pointer-events-none');
                m.firstElementChild.classList.add('scale-95');
            }
        }

        function saveSettings() {
            stopPreviewAmbient();

            state.focusDuration = (parseInt(document.getElementById('input-focus-time').value) || 25) * 60;
            state.breakDuration = (parseInt(document.getElementById('input-break-time').value) || 5) * 60;
            state.focusAmbientType = document.getElementById('select-focus-ambient-type').value;
            state.breakAmbientType = document.getElementById('select-break-ambient-type').value;
            state.focusAmbientVolume = document.getElementById('range-focus-ambient-vol').value / 100;
            state.breakAmbientVolume = document.getElementById('range-break-ambient-vol').value / 100;
            state.focusEndSound = document.getElementById('select-focus-end-sound').value;
            state.breakEndSound = document.getElementById('select-break-end-sound').value;
            state.panelOrder = document.getElementById('select-panel-order').value;
            if (!state.isRunning) {
                state.currentMode = state.panelOrder === 'break-first' ? 'break' : 'focus';
                updateActivePanelVisualState();
                state.focusRemaining = state.focusDuration;
                state.breakRemaining = state.breakDuration;
                state.startTimestamp = null;
                state.endTimestamp = null;
            }

            saveLocalState();
            applyPanelOrder();
            updateDisplay(); 
            toggleSettingsModal(false);
            
            if (state.isAmbientPlaying) startAmbientSound();
        }

        // --- MODAL AUDIO PREVIEW LOGIK ---
        function triggerAlarmPreview(phase) {
            initAudio();
            const soundElement = document.getElementById(`select-${phase}-end-sound`);
            playAlarmSound(soundElement.value);
        }

        function togglePreviewAmbient(phase) {
            initAudio();
            if (activePreviewPhase === phase) {
                stopPreviewAmbient();
                return;
            }
            stopPreviewAmbient();
            
            const type = document.getElementById(`select-${phase}-ambient-type`).value;
            const volume = parseFloat(document.getElementById(`range-${phase}-ambient-vol`).value) / 100;
            
            previewSource = audioCtx.createBufferSource();
            previewSource.buffer = createNoiseBuffer(type);
            previewSource.loop = true;
            
            previewGainNode = audioCtx.createGain();
            previewGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            previewGainNode.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.1);
            
            previewSource.connect(previewGainNode);
            previewGainNode.connect(audioCtx.destination);
            
            previewSource.start();
            activePreviewPhase = phase;
            updatePreviewButtonsUI();
        }

        function stopPreviewAmbient() {
            if (previewSource) {
                try { previewSource.stop(); } catch(e) {}
                previewSource = null;
            }
            activePreviewPhase = null;
            updatePreviewButtonsUI();
        }

        function updatePreviewButtonsUI() {
            ['focus', 'break'].forEach(phase => {
                const btn = document.getElementById(`btn-preview-ambient-${phase}`);
                if (!btn) return;
                
                const isCurrent = activePreviewPhase === phase;
                const accentColor = phase === 'focus' ? 'emerald' : 'rose';
                
                if (isCurrent) {
                    btn.className = `text-[10px] text-${accentColor}-400 hover:text-${accentColor}-300 flex items-center gap-1 bg-${accentColor}-500/25 px-1.5 py-0.5 rounded transition-all scale-105 font-semibold select-none`;
                    btn.innerHTML = `<svg class="w-2.5 h-2.5 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg><span>Stopp</span>`;
                } else {
                    btn.className = `text-[10px] text-${accentColor}-400 hover:text-${accentColor}-300 flex items-center gap-1 bg-${accentColor}-500/10 px-1.5 py-0.5 rounded transition-all select-none`;
                    btn.innerHTML = `<svg class="w-2.5 h-2.5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>Testen</span>`;
                }
            });
        }

        setInterval(() => {
            if (!state.isRunning && !isEditingInline) updateDisplay();
        }, 1000);

        window.addEventListener('DOMContentLoaded', () => {
            const saved = JSON.parse(localStorage.getItem('split_timer_v1_9') || '{}');
            if (saved.fD !== undefined) {
                state.focusDuration = saved.fD; 
                state.breakDuration = saved.bD;
                state.focusAmbientType = saved.fAT || 'brown'; 
                state.breakAmbientType = saved.bAT || 'rain';
                state.focusAmbientVolume = saved.fAV !== undefined ? saved.fAV : 0.3;
                state.breakAmbientVolume = saved.bAV !== undefined ? saved.bAV : 0.3;
                state.focusEndSound = saved.fES || 'bell';
                state.breakEndSound = saved.bES || 'harp';
                state.panelOrder = saved.pO || 'focus-first';
                setTheme(saved.theme || 'sea');
            } else {
                setTheme('sea');
            }
            state.focusRemaining = state.focusDuration;
            state.breakRemaining = state.breakDuration;
            
            applyPanelOrder();
            state.currentMode = state.panelOrder === 'break-first' ? 'break' : 'focus';
            updateActivePanelVisualState();
            lucide.createIcons();
            updateDisplay();

            ['focus', 'break'].forEach(phase => {
                const selectEl = document.getElementById(`select-${phase}-ambient-type`);
                const rangeEl = document.getElementById(`range-${phase}-ambient-vol`);
                
                selectEl.addEventListener('change', () => {
                    if (activePreviewPhase === phase) {
                        togglePreviewAmbient(phase); 
                        togglePreviewAmbient(phase); 
                    }
                });
                
                rangeEl.addEventListener('input', (e) => {
                    document.getElementById(`label-${phase}-ambient-vol`).innerText = `${e.target.value}%`;
                    if (activePreviewPhase === phase && previewGainNode && audioCtx) {
                        const newVol = parseFloat(e.target.value) / 100;
                        previewGainNode.gain.setValueAtTime(newVol, audioCtx.currentTime);
                    }
                });
            });
        });
    </script>
</body>
